name: Epic7 Shop Bot - Windows Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Testar, compilar e publicar
    runs-on: windows-latest
    permissions:
      contents: write  # Necessário para anexar arquivos a uma Release

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Validar arquivos do pacote
        shell: pwsh
        run: |
          if (-not (Test-Path 'build.spec')) { throw 'build.spec ausente' }
          if (-not (Test-Path 'templates' -PathType Container)) { throw 'Pasta templates/ ausente. Adicione as imagens PNG ao Git.' }
          $png = Get-ChildItem 'templates' -Filter '*.png' -Recurse -File
          if ($png.Count -eq 0) { throw 'Nenhum PNG encontrado em templates/' }
          Write-Host "Templates PNG encontrados: $($png.Count)"

      - name: Compilar Windows (PyInstaller onedir)
        run: python -m PyInstaller --clean --noconfirm build.spec

      - name: Empacotar e gerar SHA256
        id: package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $exe = 'dist/Epic7ShopBot/Epic7ShopBot.exe'
          if (-not (Test-Path $exe)) { throw "Executável não gerado: $exe" }

          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
          } else {
            $version = "teste-$env:RUN_NUMBER"
          }

          $zip = "Epic7ShopBot-$version-win64.zip"
          Compress-Archive -Path 'dist/Epic7ShopBot' -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'ZIP não gerado' }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$zip.sha256" >> $env:GITHUB_OUTPUT
          Write-Host "Pacote criado: $zip"

      - name: Disponibilizar build na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: Epic7ShopBot-Windows-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 14

      - name: Publicar GitHub Release (somente tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Epic7 Shop Bot ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
